<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e141a">
<meta name="description" content="Status 1 Debrief – anonymes 2-Minuten-Debrief für Rettungsdienst-Besatzungen.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Status 1">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: single-column phone tool read aloud in the vehicle; sticky bar with timer, FMS-key motif, big tap targets */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#e2e7ec; --fg:#14202b; --muted:#56636f; --line:#cbd3db;
  --accent:#d4441b; --accent-fg:#ffffff;
  --pos:#1d8552; --pos-bg:#dcf1e5; --neg:#a96200; --neg-bg:#fbe8c6;
  --key:#1b2631; --key-fg:#f3f6f9; --key-edge:#0b1117;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141a; --surface:#16202a; --surface-2:#1f2a36; --fg:#e6ecf1; --muted:#93a2b0; --line:#2b3846;
    --accent:#ff6c3e; --accent-fg:#1b0c06;
    --pos:#4fca8c; --pos-bg:#14342a; --neg:#f1ad4b; --neg-bg:#3a2a12;
    --key:#e6ecf1; --key-fg:#0e141a; --key-edge:#9aa8b5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#16202a; --surface-2:#1f2a36; --fg:#e6ecf1; --muted:#93a2b0; --line:#2b3846;
  --accent:#ff6c3e; --accent-fg:#1b0c06;
  --pos:#4fca8c; --pos-bg:#14342a; --neg:#f1ad4b; --neg-bg:#3a2a12;
  --key:#e6ecf1; --key-fg:#0e141a; --key-edge:#9aa8b5;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand b{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em}
.key{display:inline-grid;place-items:center;background:var(--key);color:var(--key-fg);font-family:var(--display);font-weight:700;border-radius:8px;box-shadow:inset 0 -3px 0 var(--key-edge)}
.key.s{width:32px;height:32px;font-size:22px}
.timer{font-family:var(--display);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:.02em;min-width:5ch;text-align:right}
.timer.over{color:var(--neg)}
.progress{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin:-12px 0 20px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s linear}

/* type */
h1,h2{font-family:var(--display);font-weight:700;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:44px;letter-spacing:.01em}
h2{font-size:34px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lead{font-size:19px;color:var(--muted);margin:0}
.hint{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px;color:var(--muted)}
.hint strong{color:var(--fg)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.small{font-size:14px;color:var(--muted)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:18px;width:100%;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-family:var(--display);font-size:24px;letter-spacing:.02em}
.btn.ghost{background:transparent}
.btn.warn{border-color:var(--neg);color:var(--neg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn small{font-family:var(--body);font-weight:500;font-size:15px;opacity:.85}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.linkrow{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:76px}
.tile b{font-size:17px}
.tile span{font-size:14px;color:var(--muted)}

/* hero */
.hero{display:flex;gap:18px;align-items:center;margin-block:8px 6px}
.key.xl{width:96px;height:96px;font-size:74px;border-radius:18px;box-shadow:inset 0 -7px 0 var(--key-edge);flex:none}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{font-size:14px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--muted)}

/* question */
.q{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.05;text-wrap:balance}
.readaloud{display:flex;gap:8px;align-items:center}
.tag-read{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;background:var(--surface-2);border-radius:6px;padding:3px 8px;color:var(--muted)}

/* chips */
.group{display:flex;flex-direction:column;gap:8px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{min-height:52px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:8px 12px;text-align:left;font-weight:500;font-size:16px;line-height:1.2;display:flex;align-items:center;gap:8px}
.chip::before{content:"";width:16px;height:16px;flex:none;border-radius:4px;border:1.5px solid var(--line)}
.mode-pos .chip[aria-pressed="true"]{background:var(--pos-bg);border-color:var(--pos)}
.mode-pos .chip[aria-pressed="true"]::before{background:var(--pos);border-color:var(--pos)}
.mode-neg .chip[aria-pressed="true"]{background:var(--neg-bg);border-color:var(--neg)}
.mode-neg .chip[aria-pressed="true"]::before{background:var(--neg);border-color:var(--neg)}
.chip.cat[aria-pressed="true"]{border-color:var(--fg);background:var(--surface-2)}
.chip.cat[aria-pressed="true"]::before{background:var(--fg);border-color:var(--fg)}
.detail{grid-column:1/-1;background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.dlabel{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.minis{display:flex;flex-wrap:wrap;gap:6px}
.msel{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 10px;font-size:15px;max-width:100%}
.mode-pos .msel.on{border-color:var(--pos);background:var(--pos-bg);font-weight:600}
.mode-neg .msel.on{border-color:var(--neg);background:var(--neg-bg);font-weight:600}
.mini{min-height:40px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:6px 12px;font-size:15px}
.mode-pos .mini[aria-pressed="true"]{background:var(--pos-bg);border-color:var(--pos);font-weight:600}
.mode-neg .mini[aria-pressed="true"]{background:var(--neg-bg);border-color:var(--neg);font-weight:600}
.dlines{display:grid;gap:2px;font-size:14px;color:var(--muted)}
.dlines b{font-weight:600}.dlines b.p{color:var(--pos)}.dlines b.n{color:var(--neg)}
.wm{display:inline-flex;align-items:baseline;gap:.3em}
.wm small{font-family:var(--body);font-weight:600;font-size:max(11px,.36em);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;border-radius:999px;padding:3px 10px}
.badge.pos{background:var(--pos-bg);color:var(--pos)}
.badge.neg{background:var(--neg-bg);color:var(--neg)}

textarea{width:100%;min-height:96px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:12px;font-size:17px;resize:vertical}
input[type=password],input[type=text]{width:100%;min-height:52px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:10px 12px;font-size:22px;letter-spacing:.3em;font-variant-numeric:tabular-nums}
select.shiftsel{width:100%;min-height:52px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 12px;font:inherit;font-size:17px}
input#station,input#su_station,input#wipe,input.shiftin,input.srvin{width:100%;min-height:52px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:10px 12px;font-size:18px}
input[type=password]::placeholder{letter-spacing:normal;font-size:17px}
label.check{display:flex;gap:10px;align-items:center;font-size:16px}
label.check input{width:22px;height:22px;accent-color:var(--accent)}

/* rules card */
.rules{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{font-family:var(--display);font-size:24px;margin:0 0 8px}
.card ul{margin:0;padding-left:20px;display:grid;gap:6px}
.www{display:grid;gap:8px;margin:10px 0}
.www div{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:start}
.www b{font-family:var(--display);font-size:26px;line-height:1;color:var(--accent)}
.www em{font-style:normal;color:var(--muted);display:block;font-size:15px}

/* stats */
.stat-head{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.num b{display:block;font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.num span{font-size:13px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;background:var(--surface);font-size:15px;font-weight:600;padding:6px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.bars{display:grid;gap:12px}
.barrow{display:grid;gap:4px}
.barrow .lbl{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.barrow .lbl span{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.barrow .lbl span .p{color:var(--pos);font-weight:600}
.barrow .lbl span .n{color:var(--neg);font-weight:600}
.track{height:12px;background:var(--surface-2);border-radius:6px;display:flex;overflow:hidden}
.track .p{background:var(--pos)}
.track .n{background:var(--neg)}
.zero{opacity:.5}
.legend{display:flex;gap:14px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.lessons{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.lessons li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.lessons li p{margin:0;min-width:0;overflow-wrap:anywhere}
.x{border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline;flex:none}
.s0{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-radius:12px;padding:12px 14px}
.s0 b{font-size:17px}
.s0 small{color:var(--muted);font-size:14px}
.key.s0k{width:40px;height:40px;font-size:28px;background:var(--accent);color:var(--accent-fg);box-shadow:none;flex:none}
.demo{background:var(--neg-bg);color:var(--neg);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600}
.err{color:var(--accent);font-size:15px;font-weight:600}

/* done */
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-top:24px}
.key.glow{width:140px;height:140px;font-size:108px;border-radius:24px;box-shadow:inset 0 -9px 0 var(--key-edge),0 0 0 8px color-mix(in srgb,var(--pos) 25%,transparent)}
@media (prefers-reduced-motion:no-preference){
  .key.glow{animation:pop .5s ease-out}
  @keyframes pop{from{transform:scale(.85);opacity:.4}to{transform:scale(1);opacity:1}}
}
@media (max-width:380px){h1{font-size:38px}.q{font-size:32px}.key.xl{width:80px;height:80px;font-size:60px}}

/* Bericht (A4) – feste helle Druckfarben, unabhängig vom App-Theme */
.linkbtn{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--accent);text-decoration:underline;cursor:pointer}
.btn[disabled]{opacity:.45;cursor:not-allowed}
details>summary{cursor:pointer;padding:4px 0}
.closebox{border-top:1px solid var(--line);padding-top:12px}
.qrbox{background:#fff;border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#14202b}
.qrbox svg{width:min(78vw,340px);height:auto;display:block}
.qrbox .small{color:#56636f}
.scanbox{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:1/1;max-width:420px;width:100%;align-self:center}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox i{position:absolute;inset:14%;border:3px solid var(--accent);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.collected li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.collected{list-style:none;margin:0;padding:0}
.okmsg{background:var(--pos-bg);color:var(--pos);border-radius:8px;padding:8px 12px;font-size:15px;font-weight:600}
.errmsg{background:var(--neg-bg);color:var(--neg);border-radius:8px;padding:8px 12px;font-size:15px;font-weight:600}
.rp-wrap{position:relative;overflow:hidden;width:100%}
.rp-doc{width:210mm;transform-origin:top left;display:flex;flex-direction:column;gap:6mm}
.rp-page{--i:#14202b;--mu:#56636f;--li:#d8dee4;--po:#1d8552;--pob:#e2f2e9;--ne:#a96200;--neb:#fbeed8;--ac:#d4441b;
  width:210mm;min-height:296mm;box-sizing:border-box;padding:12mm 16mm 10mm;background:#fff;color:var(--i);
  font-family:var(--body);font-size:10pt;line-height:1.4;display:flex;flex-direction:column;gap:6mm;
  box-shadow:0 2px 14px rgba(0,0,0,.18);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rp-page *{box-sizing:border-box}
.rp-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:3mm;border-bottom:.5mm solid var(--i)}
.rp-brand{display:flex;align-items:center;gap:2.4mm;font-family:var(--display);font-weight:700;font-size:15pt;line-height:1}
.rp-brand small{font-family:var(--body);font-weight:600;font-size:6.5pt;letter-spacing:.16em;color:var(--ac)}
.rp-key{width:7.5mm;height:7.5mm;border-radius:1.5mm;background:#1b2631;color:#f3f6f9;display:flex;align-items:center;justify-content:center;font-size:13pt;box-shadow:inset 0 -.6mm 0 #0b1117;position:relative}
.rp-key:after{content:"";position:absolute;left:30%;width:40%;bottom:1.1mm;height:.45mm;background:var(--ac)}
.rp-meta{font-size:8.5pt;color:var(--mu);text-align:right}
.rp-eyebrow{font-size:7.5pt;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
.rp-title h2{margin:1mm 0 0;font-family:var(--display);font-weight:700;font-size:20pt;line-height:1.05}
.rp-cover h1{margin:1.5mm 0 0;font-family:var(--display);font-weight:700;font-size:30pt;line-height:.95}
.rp-cover .rp-sub{margin-top:2.5mm;font-size:12pt}
.rp-cover .rp-basis{margin-top:1mm;font-size:9.5pt;color:var(--mu)}
.rp-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm}
.rp-kpi{border:.3mm solid var(--li);border-radius:2mm;padding:2.5mm 3.5mm;display:flex;flex-direction:column;gap:.5mm}
.rp-kpi b{font-family:var(--display);font-size:24pt;line-height:1}
.rp-kpi span{font-size:8.5pt;color:var(--mu)}
.rp-two{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
.rp-top{border-radius:2.5mm;padding:4mm 4.5mm;display:flex;flex-direction:column;gap:2.6mm}
.rp-top.p{background:var(--pob)} .rp-top.n{background:var(--neb)}
.rp-top h3{margin:0;font-size:8pt;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.rp-top.p h3{color:var(--po)} .rp-top.n h3{color:var(--ne)}
.rp-top ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2mm}
.rp-top li{display:grid;grid-template-columns:6mm 1fr auto;gap:2mm;align-items:baseline}
.rp-top li .no{font-family:var(--display);font-weight:700;font-size:13pt}
.rp-top li .nm{font-weight:600;font-size:11pt;line-height:1.2}
.rp-top li .nm small{display:block;font-weight:400;font-size:8.5pt;color:var(--mu)}
.rp-top li .ct{font-family:var(--display);font-weight:700;font-size:15pt}
.rp-top.p .ct,.rp-top.p .no{color:var(--po)} .rp-top.n .ct,.rp-top.n .no{color:var(--ne)}
.rp-top .none{font-size:9pt;color:var(--mu)}
.rp-box{border:.3mm solid var(--li);border-radius:2.5mm;padding:4mm 4.5mm;display:flex;flex-direction:column;gap:2mm}
.rp-box h3{margin:0;font-size:8pt;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.rp-chg2{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
.rp-chg2 .col{display:flex;flex-direction:column;gap:2mm;padding-left:3mm;border-left:1mm solid}
.rp-chg2 .col.g{border-color:var(--po)} .rp-chg2 .col.b{border-color:var(--ne)}
.rp-chg2 h4{margin:0;font-size:8pt;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.rp-chg2 .g h4{color:var(--po)} .rp-chg2 .b h4{color:var(--ne)}
.rp-ch{display:flex;flex-direction:column;gap:.8mm;padding:1mm 0;border-top:.2mm solid var(--li)}
.rp-ch:first-of-type{border-top:0}
.rp-ch .t{font-size:9.5pt;line-height:1.3}
.rp-ch .cmp{display:grid;grid-template-columns:auto 1fr 8mm auto 1fr 8mm;column-gap:1.5mm;align-items:center;font-size:7.5pt;color:var(--mu)}
.rp-ch .rbar{display:block;height:2.4mm;background:#eef1f4;border-radius:.6mm;overflow:hidden}
.rp-ch .rbar i{display:block;height:100%}
.rp-ch .rbar i.was{background:#b9c2cb} .rp-ch .rbar i.ng{background:var(--ne)} .rp-ch .rbar i.ps{background:var(--po)}
.rp-ch .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--i)}
.rp-chg{display:grid;grid-template-columns:5mm 1fr auto;gap:2mm;align-items:baseline;padding:1.2mm 0;border-top:.2mm solid var(--li)}
.rp-chg:first-of-type{border-top:0}
.rp-chg .ar{font-weight:700;font-size:11pt}
.rp-chg .ar.g{color:var(--po)} .rp-chg .ar.b{color:var(--ne)}
.rp-chg .v{font-variant-numeric:tabular-nums;color:var(--mu);font-size:9pt}
.rp-note{font-size:8.5pt;color:var(--mu)}
.rp-chart{display:flex;flex-direction:column}
.rp-ch-head{display:grid;grid-template-columns:52mm 1fr 1fr;font-size:8pt;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding-bottom:1.5mm}
.rp-ch-head .l{text-align:right;padding-right:3mm;color:var(--po)} .rp-ch-head .r{padding-left:3mm;color:var(--ne)}
.rp-grp{font-size:7.5pt;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);padding:3mm 0 1mm;border-bottom:.2mm solid var(--li)}

function optList(list,sel){

  return h+(open?"</optgroup>":"");
}
function detailHtml(id){
  const D=DET[id];if(!D)return "";
  const out=[];
  ["pos","neg"].forEach(m=>{
    const pre=m+"|"+id+"|", lab=m==="pos"?"lief gut":"besser machen";
    const shown=[];let hidden=0;
    Object.keys(db.place||{}).filter(k=>k.startsWith(pre)).sort((a,b)=>db.place[b]-db.place[a]).forEach(k=>{const c=db.place[k];if(m==="neg"&&c<MIN_NEG)hidden+=c;else shown.push(esc(k.slice(pre.length))+" "+c+"×")});
    if(shown.length||hidden)out.push(`<div><b class="${m==='pos'?'p':'n'}">${lab}, wo:</b> ${shown.join(" · ")}${hidden?(shown.length?" · ":"")+hidden+"× ohne Ortsangabe (unter "+MIN_NEG+" je Einrichtung)":""}</div>`);

      `<div class="stack" style="gap:10px"><button class="btn primary" data-a="next">Ja, alle okay</button><button class="btn" data-a="help">Jemand braucht noch etwas</button></div>`;
  }else if(key==="pos"){
    body=`<span class="badge pos">Wird als „lief gut“ gezählt</span>`+chipGrid(run.pos,"pos");
  }else if(key==="neg"){
    body=`<span class="badge neg">Wird als „besser machen“ gezählt</span>`+chipGrid(run.neg,"neg");
  }else if(key==="take"){
    body=`<div class="stack" style="gap:8px">
      <label for="lesson" class="eyebrow">Lehre aus dem Einsatz notieren (freiwillig, auch mehrere)</label>
      <textarea id="lesson" maxlength="140" placeholder="z. B. Bei unklarer Lage früher Notarzt nachfordern.">${esc(run.lesson)}</textarea>
      <div class="small"><span id="cnt">${run.lesson.length}</span>/140 · Steht für die nächsten Besatzungen unter „Dringender Sprechwunsch“ und bleibt anonym in der Auswertung der Wache, auch wenn sie dort entfernt wird. Keine Namen, keine Patientendaten, keine Orte.</div>
      <button class="btn" data-a="addn">+ Weitere Lehre</button>
      ${run.notes.length?`<ul class="lessons">${run.notes.map((e,i)=>`<li><p>${esc(e.t)}</p><button class="x" data-a="deln" data-i="${i}">Entfernen</button></li>`).join("")}</ul>`:""}
     </div>`;
  }else if(key==="cat"){
    body=`<div class="chips">`+CATS.map(c=>`<button class="chip cat" data-a="cat" data-c="${c}" aria-pressed="${run.cat===c}">${c}</button>`).join("")+`</div>`;
    next=`<button class="btn primary" data-a="next">${run.cat?"Weiter":"Überspringen"}</button>`;
  }else if(key==="feedback"){
    body=run.showRules?rulesCard():`<button class="btn" data-a="rulesShow">Feedback-Regeln zeigen</button>`;
    next=`<button class="btn primary" data-a="finish">Abschließen</button>`;
  }
  return `<div class="stack">
   <div class="eyebrow">Schritt ${n} von ${total}${run.mode==="lang"?" · Ausführlich":""}</div>
   <div class="readaloud"><span class="tag-read">Vorlesen</span></div>

   <div class="hint">${mod}</div>
   ${body}
   ${next}
   ${run.step>0?`<button class="btn ghost" data-a="back">Zurück</button>`:`<button class="btn ghost" data-a="abort">Abbrechen</button>`}
  </div>`;
}

    Object.keys(db.place||{}).filter(k=>k.startsWith(pre)).forEach(k=>{const c=db.place[k];if(m==="neg"&&c<MIN_NEG)return;dl.push(`${TAGNAME[id]};Ort: ${k.slice(pre.length)};${lab};${c}`)});

  return s;
}

  tick();
  const ta=document.getElementById("lesson");
  if(ta)ta.addEventListener("input",()=>{run.lesson=ta.value;const c=document.getElementById("cnt");if(c)c.textContent=ta.value.length});

function go(v){view=v;ui={...(v==="stats"?{}:{})};if(v==="wall")markSeen();render();window.scrollTo(0,0)}
// Schichtwechsel: gelesene Fahrzeug-Hinweise erst in der nächsten Schicht wieder oben anzeigen
function shiftTimes(){const t=(db.settings.shifts||"07:00, 18:00").split(/[,;\s]+/).map(x=>/^(\d{1,2}):(\d{2})$/.exec(x)).filter(Boolean).map(m=>(+m[1])*60+(+m[2])).filter(x=>x>=0&&x<1440).sort((a,b)=>a-b);return t.length?t:[420,1080]}
function curShift(){const T=shiftTimes(),n=new Date(),m=n.getHours()*60+n.getMinutes();let d=new Date(n),st=null;
  for(const x of T)if(x<=m)st=x;if(st===null){d.setDate(d.getDate()-1);st=T[T.length-1]}
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()+"T"+st}
function unseenFzg(){const F=(db.board||[]).filter(e=>e.k==="fzg");return db.seen&&db.seen.shift===curShift()?[]:F}
function markSeen(){db.seen={shift:curShift()};save()}
const SHIFT_PRESETS=[["07:00, 18:00","07–18 Uhr und 18–07 Uhr"],["07:00, 19:00","07–19 Uhr und 19–07 Uhr"],["06:00, 18:00","06–18 Uhr und 18–06 Uhr"],["06:00, 14:00, 22:00","Drei Schichten: 06, 14 und 22 Uhr"],["07:00","24-Stunden-Dienst, Wechsel um 07 Uhr"],["custom","Eigene Uhrzeiten"]];
function shiftPicker(px,cur){cur=cur||"07:00, 18:00";const pre=SHIFT_PRESETS.some(x=>x[0]===cur);
  return `<select id="${px}shiftsel" class="shiftsel" data-px="${px}" aria-label="Schichtzeiten">${SHIFT_PRESETS.map(([v,l])=>`<option value="${v}" ${(pre?v===cur:v==="custom")?"selected":""}>${l}</option>`).join("")}</select>
   <input id="${px}shifts" class="shiftin" maxlength="60" value="${esc(cur)}" placeholder="z. B. 06:30, 18:30" aria-label="Eigene Schichtwechsel-Uhrzeiten" ${pre?"hidden":""}>`}
function readShift(px){const sel=(document.getElementById(px+"shiftsel")||{}).value||"07:00, 18:00";
  if(sel!=="custom")return sel;
  const parts=((document.getElementById(px+"shifts")||{}).value||"").trim().split(/[,;\s]+/).filter(Boolean);
  const ok=parts.length>0&&parts.every(x=>{const m=/^(\d{1,2}):(\d{2})$/.exec(x);return m&&+m[1]<24&&+m[2]<60});
  return ok?parts.map(x=>x.padStart(5,"0")).join(", "):null}

function tick(){
  if(view!=="flow"||!run)return;
  const left=run.dur-(Date.now()-run.t0)/1000;
  const t=document.getElementById("timer"),p=document.getElementById("prog");
  if(t){t.textContent=fmt(left);t.classList.toggle("over",left<0)}
  if(p)p.style.width=Math.min(100,(1-left/run.dur)*100)+"%";
}
setInterval(tick,500);

function flushNote(){const t=(run.lesson||"").trim().slice(0,140);if(t){run.notes.push({t,k:"lehre"});run.lesson=""}}
function addNote(t,k){
  db.board=db.board||[];
  db.board.splice(Math.floor(Math.random()*(db.board.length+1)),0,{t,k});
  if(k==="lehre")db.lessons.splice(Math.floor(Math.random()*(db.lessons.length+1)),0,t);
}
function finish(){
  run.pos.forEach(id=>{(db.counts[id]=db.counts[id]||{pos:0,neg:0}).pos++});
  run.neg.forEach(id=>{(db.counts[id]=db.counts[id]||{pos:0,neg:0}).neg++});
  db.debriefs++;
  db.place=db.place||{};db.asp=db.asp||{};
  ["pos","neg"].forEach(m=>{(m==="pos"?run.pos:run.neg).forEach(id=>{const d=run.det[m][id];if(!d)return;
    if(d.place){const k=m+"|"+id+"|"+d.place;db.place[k]=(db.place[k]||0)+1}
    d.asp.forEach(x=>{const k=m+"|"+id+"|"+x;db.asp[k]=(db.asp[k]||0)+1})})});
  if(run.cat)db.cats[run.cat]=(db.cats[run.cat]||0)+1;
  flushNote();
  run.notes.forEach(e=>addNote(e.t,e.k));
  queueDelta(run);
  const l=run.notes.length;
  save();
  const last={p:run.pos.size,n:run.neg.size,l:l};
  run=null;unlockScreen();view="done";ui={last};render();window.scrollTo(0,0);
}

// ---------- Zentrale Auswertung (Server) ----------
const BATCH=3;
let joinMsg=null,sending=false;
function normCode(c){c=String(c||"").replace(/[^0-9a-z]/gi,"").toUpperCase();return c.length===12?c.slice(0,4)+"-"+c.slice(4,8)+"-"+c.slice(8):""}
function curMonth(){return TODAY().slice(0,7)}
function queueDelta(r){
  if(!db.settings.server||!db.settings.code)return;
  db.outbox=db.outbox||{};const m=curMonth(),o=db.outbox[m]=db.outbox[m]||{month:m,n:0,counts:{},place:{},asp:{},cats:{},lessons:[]};
  o.n++;
  r.pos.forEach(id=>{(o.counts[id]=o.counts[id]||{pos:0,neg:0}).pos++});
  r.neg.forEach(id=>{(o.counts[id]=o.counts[id]||{pos:0,neg:0}).neg++});
  ["pos","neg"].forEach(md=>{(md==="pos"?r.pos:r.neg).forEach(id=>{const d=r.det[md][id];if(!d)return;
    if(d.place){const k=md+"|"+id+"|"+d.place;o.place[k]=(o.place[k]||0)+1}
    d.asp.forEach(x=>{const k=md+"|"+id+"|"+x;o.asp[k]=(o.asp[k]||0)+1})})});
  if(r.cat)o.cats[r.cat]=(o.cats[r.cat]||0)+1;
  r.notes.forEach(e=>{if(e.k==="lehre")o.lessons.push(e.t)});
  if(!db.outboxSince)db.outboxSince=TODAY();
  save();setTimeout(()=>trySend(false),1500+Math.random()*8000);
}
function pendingN(){return Object.values(db.outbox||{}).reduce((a,o)=>a+o.n,0)}
async function trySend(force){
  const S=db.settings;if(sending||!S.server||!S.code)return false;
  const n=pendingN();if(!n)return false;
  if(!force&&n<BATCH&&!(db.outboxSince&&db.outboxSince<TODAY()))return false;
  if(location.protocol==="https:"&&/^http:/i.test(S.server)){db.sendErr="Diese App-Version läuft über https und darf den Testserver (http) nicht erreichen. Bitte die App über den QR-Code im Wachenportal öffnen.";save();return false}
  sending=true;
  try{
    const packets=Object.values(db.outbox).sort((a,b)=>a.month<b.month?-1:1).slice(0,3).map(o=>Object.assign({},o,{lessons:shuffle(o.lessons.slice()).slice(0,20)}));
    const res=await fetch(S.server.replace(/\/+$/,"")+"/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:S.code,packets})});
    const j=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(j.error||("Fehler "+res.status));
    packets.forEach(p=>{delete db.outbox[p.month]});
    if(!pendingN())db.outboxSince=null;
    db.lastSent=TODAY();db.sendErr=null;save();sending=false;
    if(view==="settings")render();return true;
  }catch(e){db.sendErr=e.message==="Failed to fetch"?"Server nicht erreichbar. Die Debriefs bleiben gespeichert und werden später übertragen.":e.message;save();sending=false;if(view==="settings")render();return false}
}
function srvStatus(){const S=db.settings;if(!S.server||!S.code)return `<p class="small" style="margin:0"><b>Nicht verbunden.</b></p>`;
  const n=pendingN();
  return `<p class="small" style="margin:0"><b>Verbunden</b> mit ${esc(S.server)} · Code …${esc(S.code.slice(-4))}<br>${n?n+(n===1?" Debrief wartet":" Debriefs warten")+" auf Übertragung (ab "+BATCH+" oder am nächsten Tag)":"Alles übertragen"}${db.lastSent?" · zuletzt am "+dLong(db.lastSent):""}</p>${db.sendErr?`<div class="errmsg">${esc(db.sendErr)}</div>`:""}`}
(function joinFromLink(){
  try{const u=new URL(location.href),w=normCode(u.searchParams.get("w"));if(!w)return;
    const s=u.searchParams.get("s")||(/\/app\/?/.test(u.pathname)?location.origin:"");
    if(s){db.settings.server=s;db.settings.code=w;save();joinMsg="Mit der Wache verbunden. Debriefs werden ab jetzt gebündelt an die Wache übertragen."}

})();

// ---------- Bericht, Abschluss, Zusammenführen ----------
function TODAY(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const MON=["Jan.","Feb.","März","Apr.","Mai","Juni","Juli","Aug.","Sept.","Okt.","Nov.","Dez."];
function dLong(iso){if(!iso)return"";const p=iso.split("-").map(Number);return p[2]+". "+MON[p[1]-1]+" "+p[0]}
function rid(){return Math.random().toString(36).slice(2,10)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function emptyData(){return{n:0,counts:{},place:{},asp:{},cats:{},lessons:[],veh:0,from:null,to:null}}
function addInto(t,x){
  t.n+=+x.n||0;
  Object.keys(x.counts||{}).forEach(k=>{const a=t.counts[k]=t.counts[k]||{pos:0,neg:0},b=x.counts[k]||{};a.pos+=+b.pos||0;a.neg+=+b.neg||0});
  ["place","asp","cats"].forEach(f=>Object.keys(x[f]||{}).forEach(k=>{t[f][k]=(t[f][k]||0)+(+x[f][k]||0)}));
  t.lessons=t.lessons.concat(x.lessons||[]);
  t.veh+=+x.veh||1;
  if(x.from&&(!t.from||x.from<t.from))t.from=x.from;
  if(x.to&&(!t.to||x.to>t.to))t.to=x.to;
  return t;
}
function ownSnap(){if(!db.snapId){db.snapId=rid();save()}
  return{v:1,id:db.snapId,from:db.since||null,to:TODAY(),n:db.debriefs,counts:db.counts,place:db.place||{},asp:db.asp||{},cats:db.cats||{},lessons:db.lessons||[],veh:1}}
function dataset(merged){const d=addInto(emptyData(),ownSnap());if(merged)(db.collected||[]).forEach(c=>addInto(d,c));d.lessons=shuffle(d.lessons.slice());return d}
function totalsOf(d){const t={};Object.keys(d.counts).forEach(k=>t[k]=[d.counts[k].pos||0,d.counts[k].neg||0]);return t}
function prevFor(merged){const h=(db.history||[]).filter(x=>!!x.merged===!!merged);return h[h.length-1]||null}
function pct(c,n){return n?Math.round(c/n*100):0}
function rRows(d){const r=[];TAGS.forEach(g=>g.items.forEach(([id,n])=>{const c=d.counts[id]||{};r.push({id,n,g:g.g,p:c.pos||0,m:c.neg||0})}));return r}
function topAsp(d,m,id){const pre=m+"|"+id+"|";let best=null,bc=0;Object.keys(d.asp).forEach(k=>{if(k.startsWith(pre)&&d.asp[k]>bc){bc=d.asp[k];best=k.slice(pre.length)}});return best?{x:best,c:bc}:null}
function changes(d,prev){
  if(!prev||!prev.n||!d.n)return[];
  const out=[];
  rRows(d).forEach(r=>{const pv=(prev.t||{})[r.id]||[0,0];
    [["m",1,"besser machen"],["p",0,"lief gut"]].forEach(([f,i,lab])=>{const now=r[f],bef=pv[i];if(Math.max(now,bef)<3)return;
      const a=pct(bef,prev.n),b=pct(now,d.n);if(Math.abs(b-a)<10)return;
      out.push({n:r.n,f,lab,a,b,good:f==="m"?b<a:b>a,d:Math.abs(b-a)})})});
  return out.sort((x,y)=>y.d-x.d).slice(0,6);
}
function periodText(d){return d.from?dLong(d.from)+" – "+dLong(d.to):"bis "+dLong(d.to)}
function rpPage(no,total,meta,title,body){
  return `<section class="rp-page"><header class="rp-head"><span class="rp-brand"><span class="rp-key">1</span>Status 1<small>DEBRIEF</small></span><span class="rp-meta">${meta}</span></header>
  ${title?`<div class="rp-title"><span class="rp-eyebrow">${title[0]}</span><h2>${title[1]}</h2></div>`:""}${body}
  <footer class="rp-foot"><span>Anonym erhoben: keine Namen, keine Patientendaten, keine Uhrzeiten. Einrichtungen bei „besser machen“ erst ab ${MIN_NEG} Nennungen.</span><span>Seite ${no} von ${total}</span></footer></section>`;
}

   <div class="rp-box"><h3>Nach Bereichen</h3><div class="rp-areas">${(()=>{const A=TAGS.map(g=>{let p=0,m=0;g.items.forEach(([id])=>{const r=rows.find(x=>x.id===id);p+=r.p;m+=r.m});return{g:g.g,p,m}});const mx=Math.max(1,...A.map(a=>a.p+a.m));

function loadLib(src,name){return new Promise((ok,no)=>{if(window[name])return ok();const s=document.createElement("script");s.src=src;s.onload=()=>ok();s.onerror=()=>no(new Error("lib"));document.head.appendChild(s)})}
function b64(u8){let s="";for(let i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s)}
function unb64(t){const b=atob(t),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function packSnap(){const json=JSON.stringify(ownSnap());let enc="j",body=null;
  try{if(window.CompressionStream){const buf=await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer();body=b64(new Uint8Array(buf));enc="z"}}catch(e){body=null}
  if(!body){body=b64(new TextEncoder().encode(json));enc="j"}
  const id=ownSnap().id,size=650,parts=[];for(let i=0;i<body.length;i+=size)parts.push(body.slice(i,i+size));
  return parts.map((p,i)=>`S1|${id}|${enc}|${i+1}|${parts.length}|${p}`);
}
async function unpack(enc,body){const u=unb64(body);
  if(enc==="z"){const buf=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();return JSON.parse(new TextDecoder().decode(buf))}
  return JSON.parse(new TextDecoder().decode(u))}
function cleanSnap(x){
  if(!x||x.v!==1||typeof x.counts!=="object")throw new Error("format");
  const num=v=>Math.max(0,Math.min(100000,Math.floor(+v||0))),obj=o=>{const r={};Object.keys(o||{}).slice(0,2000).forEach(k=>{r[String(k).slice(0,200)]=num(o[k])});return r};
  const counts={};Object.keys(x.counts).forEach(k=>{if(TAGNAME[k])counts[k]={pos:num(x.counts[k].pos),neg:num(x.counts[k].neg)}});
  return{v:1,id:String(x.id||rid()).slice(0,20),from:typeof x.from==="string"?x.from.slice(0,10):null,to:typeof x.to==="string"?x.to.slice(0,10):null,n:num(x.n),counts,place:obj(x.place),asp:obj(x.asp),cats:obj(x.cats),lessons:(Array.isArray(x.lessons)?x.lessons:[]).slice(0,500).map(t=>String(t).slice(0,140)),veh:1};
}
function addCollected(raw){

  if(x.id===ownSnap().id){ui.err="Das ist der Stand dieses Geräts. Bitte auf einem anderen Fahrzeug weitergeben.";ui.ok=null;return false}
  db.collected=(db.collected||[]).filter(c=>c.id!==x.id).concat([x]);save();

}

let cam=null,scanParts={};
function stopCam(){if(cam){try{cam.stream.getTracks().forEach(t=>t.stop())}catch(e){}cancelAnimationFrame(cam.raf);cam=null}}
async function startCam(){
  try{await loadLib("lib/jsQR.js","jsQR");
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    const v=document.getElementById("camv");if(!v){stream.getTracks().forEach(t=>t.stop());return}
    v.srcObject=stream;v.setAttribute("playsinline","");await v.play();
    const c=document.createElement("canvas"),x=c.getContext("2d",{willReadFrequently:true});
    cam={stream,raf:0,last:0};
    const loop=async ts=>{if(!cam)return;cam.raf=requestAnimationFrame(loop);if(ts-cam.last<250||!v.videoWidth)return;cam.last=ts;
      const w=Math.min(720,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);c.width=w;c.height=h;x.drawImage(v,0,0,w,h);
      const r=window.jsQR(x.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"dontInvert"});if(r&&r.data)await onCode(r.data)};
    cam.raf=requestAnimationFrame(loop);ui.camOn=true;ui.err=null;
    const st=document.getElementById("scanstate");if(st)st.textContent="Kamera auf den Code richten.";
  }catch(e){stopCam();ui.camOn=false;ui.err="Die Kamera ist nicht verfügbar. Bitte den Stand als Datei übertragen.";render()}
}
async function onCode(t){
  const m=/^S1\|([^|]+)\|([jz])\|(\d+)\|(\d+)\|(.+)$/.exec(t);if(!m)return;
  const [,id,enc,i,n,body]=m;const P=scanParts[id]=scanParts[id]||{enc,n:+n,got:{}};P.got[i]=body;
  const have=Object.keys(P.got).length,st=document.getElementById("scanstate");
  if(have<P.n){if(st)st.textContent=`Teil ${have} von ${P.n} erkannt. Auf dem anderen Gerät „Nächster Teil“ tippen.`;return}
  let body2="";for(let k=1;k<=P.n;k++)body2+=P.got[k];delete scanParts[id];
  try{const x=await unpack(P.enc,body2);addCollected(x)}catch(e){ui.err="Der Code konnte nicht gelesen werden. Bitte erneut scannen.";ui.ok=null}
  stopCam();ui.camOn=false;render();
}

  else if(a==="demo"){loadDemo()}
  else if(a==="dell"){db.lessons.splice(+b.dataset.i,1);save();render()}
  else if(a==="copy"){const t=document.getElementById("csv");const done=()=>{ui.copied=true;render()};
    try{navigator.clipboard.writeText(t.value).then(done).catch(()=>{t.focus();t.select()})}catch(err){t.focus();t.select()}}
  else if(a==="askreset"){ui.confirmReset=true;render()}
  else if(a==="reset"){const s=db.settings,bd=db.board||[];db=blank();db.settings=s;db.board=bd;save();ui={};render()}
  else if(a==="askcat"){db.settings.askCat=b.checked;save()}
  else if(a==="ntype"){run.noteType=b.dataset.t;render()}
  else if(a==="addn"){flushNote();render()}
  else if(a==="deln"){run.notes.splice(+b.dataset.i,1);render()}
  else if(a==="wtype"){ui.wtype=b.dataset.t;b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b))}
  else if(a==="addw"){const v=((document.getElementById("wnote")||{}).value||"").trim().slice(0,140);if(v){addNote(v,ui.wtype==="lehre"?"lehre":"fzg");markSeen();save();render()}}
  else if(a==="delb"){db.board.splice(+b.dataset.i,1);save();render()}
  else if(a==="setpin"){const g=x=>((document.getElementById(x)||{}).value||"").trim(),o=g("oldpin"),v=g("newpin"),v2=g("newpin2");
    if(o!==db.settings.pin){ui={pinMsg:"Die bisherige PIN stimmt nicht."}}
    else if(!/^\d{4,8}$/.test(v)){ui={pinMsg:"Die neue PIN muss aus 4 bis 8 Ziffern bestehen."}}
    else if(v!==v2){ui={pinMsg:"Die beiden neuen PINs stimmen nicht überein."}}
    else{db.settings.pin=v;save();ui={pinMsg:"PIN geändert.",pinOk:true}}render()}
});
app.addEventListener("change",e=>{const t=e.target;if(!t.classList||!t.classList.contains("msel")||!run)return;
  const m=t.dataset.mode,id=t.dataset.id;const d=run.det[m][id]=run.det[m][id]||{place:null,asp:[]};d.place=t.value||null;render()});
app.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pin"){e.preventDefault();app.querySelector('[data-a="pinok"]').click()}});

render();
})();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
</script>
